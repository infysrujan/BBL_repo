version: 1

indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
    target: /query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")

      path:
        select: path

      metaTitle:
        select: head > meta[name="title"], head > title
        value: |
          attribute(el, 'content') || text(el)

      metaDescription:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')

      metaKeywords:
        select: head > meta[name="keywords"]
        value: |
          attribute(el, 'content')

      ogTitle:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')

      ogDescription:
        select: head > meta[property="og:description"]
        value: |
          attribute(el, 'content')

      ogImage:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')

      ogUrl:
        select: head > meta[property="og:url"], head > link[rel="canonical"]
        value: |
          attribute(el, 'content') || attribute(el, 'href')