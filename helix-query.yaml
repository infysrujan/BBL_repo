version: 1

indices:
  site-en: &base-site
    include:
      - "/en/**"
    exclude:
      - "/*.json"
      - "/**/*.json"
    target: /en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"], head > title
        value: |
          attribute(el, 'content') || textContent(el)
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      ogTitle:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      ogDescription:
        select: head > meta[property="og:description"]
        value: |
          attribute(el, 'content')
      ogImage:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https://[^/]+(/.*)')
      ogUrl:
        select: head > meta[property="og:url"], head > link[rel="canonical"]
        value: |
          attribute(el, 'content') || attribute(el, 'href')
      keywords:
        select: head > meta[name="keywords"]
        value: |
          attribute(el, 'content')
      theme:
        select: head > meta[name="theme"]
        value: |
          attribute(el, 'content')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      lastModified:
        select: head > meta[name="last-update"]
        value: |
          parseTimestamp(attribute(el, "content"), 'ddd MMM DD YYYY hh:mm:ss GMT')
      lastContentModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")

  site-th:
    <<: *base-site
    include:
      - "/th-TH/**"
    exclude:
      - "/*.json"
      - "/**/*.json"
    target: /th-TH/query-index.json