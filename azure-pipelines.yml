trigger:
  branches:
    include:
      - dev
      - main
      - stage
      - feature/*

pr:
  branches:
    include:
      - dev
      - stage
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# STAGE 1: LINT
# =========================
- stage: Lint
  displayName: "Code Quality Checks"
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: |
        set -e
        npm install
        echo "✅ Dependencies installed"
      displayName: 'Install dependencies'

    - script: |
        set -e
        npx eslint . --ext .js,.ts,.jsx,.tsx
        echo "✅ ESLint passed"
      displayName: 'Run ESLint'

    - script: |
        npx stylelint "**/*.css" "**/*.scss"
        echo "✅ Stylelint completed"
      displayName: 'Run Stylelint'
      continueOnError: true


# =========================
# STAGE 2: PERFORMANCE
# =========================
- stage: Performance
  displayName: "AEM EDS Validation + Lighthouse"
  dependsOn: Lint
  condition: succeeded()
  jobs:
  - job: LighthouseJob
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: |
        set -e
        sudo apt-get update
        sudo apt-get install -y jq bc
        npm install -g @lhci/cli@0.13.x broken-link-checker
        echo "✅ Tools installed"
      displayName: 'Install tools'

    # =========================
    # SET TEST URL
    # =========================
    - script: |
        set -e

        RAW_BRANCH=$(Build.SourceBranchName)
        BRANCH_NAME=$(echo $RAW_BRANCH | sed 's/\//-/g')

        if [ "$BRANCH_NAME" = "main" ]; then
          TEST_URL="https://main--site-dev--singhalgoru.aem.live/en"
        else
          TEST_URL="https://${BRANCH_NAME}--site-stage--bangkok-bank.aem.page/en"
        fi

        echo "Using URL: $TEST_URL"
        echo "##vso[task.setvariable variable=TEST_URL]$TEST_URL"
        echo "✅ URL resolved"
      displayName: 'Set Test URL'

    # =========================
    # CDN HEADER CHECK
    # =========================
    - script: |
        set -e

        HEADERS=$(curl -s -I $(TEST_URL))
        echo "$HEADERS"

        if ! echo "$HEADERS" | grep -qi "cache-control"; then
          echo "❌ Cache-Control header missing"
          exit 1
        fi

        echo "✅ CDN headers validated"
      displayName: 'Validate CDN Headers'

    # =========================
    # BROKEN LINKS
    # =========================
    - script: |
        set -e
        blc $(TEST_URL) -ro
        echo "✅ No broken links"
      displayName: 'Check Broken Links'

    # =========================
    # LIGHTHOUSE
    # =========================
    - script: |
        set -e

        lhci collect --url="$(TEST_URL)" --numberOfRuns=3

        echo "Uploading to temporary public storage..."
        LHCI_OUTPUT=$(lhci upload --target=temporary-public-storage)
        echo "$LHCI_OUTPUT"

        PUBLIC_URL=$(echo "$LHCI_OUTPUT" | grep -Eo 'https://[^ ]+\.html' | head -1)

        echo "🔗 Lighthouse Report: $PUBLIC_URL"
        echo "##vso[task.setvariable variable=LHCI_PUBLIC_URL]$PUBLIC_URL"

        echo "✅ Lighthouse completed"
      displayName: 'Run Lighthouse CI'

    # =========================
    # EXTRACT BEST REPORT
    # =========================
    - script: |
        set -e

        BEST_SCORE=0
        BEST_FILE=""

        for file in $(find .lighthouseci -name "lhr-*.json"); do
          SCORE=$(jq '.categories.performance.score * 100' "$file")

          if (( $(echo "$SCORE > $BEST_SCORE" | bc -l) )); then
            BEST_SCORE=$SCORE
            BEST_FILE=$file
          fi
        done

        BEST_HTML=$(echo $BEST_FILE | sed 's/.json/.html/')

        mkdir best-report
        cp "$BEST_HTML" best-report/lighthouse-best.html

        echo "##vso[task.setvariable variable=BEST_SCORE]$BEST_SCORE"
        echo "##vso[task.setvariable variable=BEST_HTML]best-report/lighthouse-best.html"

        echo "🏆 Best Score: $BEST_SCORE"
      displayName: 'Extract Best Report'

    # =========================
    # PUBLISH BEST REPORT
    # =========================
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'best-report'
        artifactName: 'lighthouse-report'
      displayName: 'Publish Best Lighthouse Report'

    # =========================
    # SUMMARY (3 RUNS + LINK)
    # =========================
    - script: |
        set -e

        SUMMARY_FILE="$(System.DefaultWorkingDirectory)/summary.md"

        echo "## 🚀 Lighthouse Report Summary" > $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE

        echo "**Best Performance Score:** $(BEST_SCORE)" >> $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE

        echo "### 🔗 View Full Report" >> $SUMMARY_FILE
        echo "[Open Lighthouse Report]($(LHCI_PUBLIC_URL))" >> $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE

        echo "### 📊 All Runs Summary" >> $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE
        echo "| URL | Perf | A11y | SEO | LCP | CLS |" >> $SUMMARY_FILE
        echo "|-----|------|------|-----|-----|-----|" >> $SUMMARY_FILE

        PASS=0

        for file in $(find .lighthouseci -name "lhr-*.json"); do
          URL=$(jq -r '.finalUrl' "$file')

          PERF=$(jq '.categories.performance.score * 100' "$file")
          A11Y=$(jq '.categories.accessibility.score * 100' "$file")
          SEO=$(jq '.categories.seo.score * 100' "$file")

          LCP=$(jq -r '.audits["largest-contentful-paint"].displayValue' "$file")
          CLS=$(jq -r '.audits["cumulative-layout-shift"].displayValue' "$file")

          echo "| $URL | $PERF | $A11Y | $SEO | $LCP | $CLS |" >> $SUMMARY_FILE

          if (( $(echo "$PERF >= 80" | bc -l) )); then
            PASS=1
          fi
        done

        echo "" >> $SUMMARY_FILE

        if [ $PASS -eq 1 ]; then
          echo "🎉 At least one run passed (≥80)" >> $SUMMARY_FILE
        else
          echo "🚨 All runs below threshold" >> $SUMMARY_FILE
          exit 1
        fi

        echo "##vso[task.uploadsummary]$SUMMARY_FILE"

        echo "✅ Summary published"
      displayName: 'Publish Summary'