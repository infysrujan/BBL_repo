trigger:
  branches:
    include:
      - dev
      - main
      - feature/*

pr:
  branches:
    include:
      - dev
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# STAGE 1: LINT
# =========================
- stage: Lint
  displayName: "Code Quality Checks"
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: npm install
      displayName: 'Install dependencies'

    - script: npx eslint . --ext .js,.ts,.jsx,.tsx
      displayName: 'Run ESLint'

    - script: npx stylelint "**/*.css" "**/*.scss"
      displayName: 'Run Stylelint'
      continueOnError: true


# =========================
# STAGE 2: PERFORMANCE + EDS CHECKS
# =========================
- stage: Performance
  displayName: "AEM EDS Validation + Lighthouse"
  dependsOn: Lint
  condition: succeeded()
  jobs:
  - job: LighthouseJob
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: |
        sudo apt-get update
        sudo apt-get install -y jq bc
      displayName: 'Install dependencies'

    - script: npm install -g @lhci/cli@0.13.x broken-link-checker
      displayName: 'Install tools'

    # =========================
    # DETERMINE BRANCH URL
    # =========================
    - script: |
        RAW_BRANCH=$(Build.SourceBranchName)
        BRANCH_NAME=$(echo $RAW_BRANCH | sed 's/\//-/g')

        if [ "$BRANCH_NAME" = "main" ]; then
          URL="https://main--site-dev--singhalgoru.aem.live/en"
        else
          URL="https://${BRANCH_NAME}--site-dev--singhalgoru.aem.page/en"
        fi

        echo "##vso[task.setvariable variable=TEST_URL]$URL"
        echo "Testing URL: $URL"
      displayName: 'Set Test URL'

    # =========================
    # CDN HEADER VALIDATION
    # =========================
    - script: |
        echo "Checking CDN headers..."

        HEADERS=$(curl -s -I $(TEST_URL))
        echo "$HEADERS"

        CACHE=$(echo "$HEADERS" | grep -i "cache-control")

        if [[ "$CACHE" != *"max-age"* ]]; then
          echo "❌ Cache-Control missing"
          exit 1
        fi
      displayName: 'Validate CDN Headers'

    # =========================
    # BROKEN LINK CHECK
    # =========================
    - script: |
        echo "Running broken link check..."
        blc $(TEST_URL) -ro
      displayName: 'Check Broken Links'

    # =========================
    # LIGHTHOUSE RUN (BRANCH AWARE)
    # =========================
    - script: |
        lhci collect --url="$(TEST_URL)" --numberOfRuns=3
        lhci assert
        lhci upload
      displayName: 'Run Lighthouse CI'

    # =========================
    # PUBLISH HTML REPORT
    # =========================
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '.lighthouseci'
        artifactName: 'lighthouse-report'
      displayName: 'Publish Lighthouse Report'

    # =========================
    # ENHANCED SUMMARY
    # =========================
    - script: |
        SUMMARY_FILE="$(System.DefaultWorkingDirectory)/summary.md"

        echo "## 🚀 Lighthouse Report" > $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE
        echo "| URL | Perf | A11y | SEO | LCP | CLS |" >> $SUMMARY_FILE
        echo "|-----|------|------|-----|-----|-----|" >> $SUMMARY_FILE

        FILES=$(find .lighthouseci -name "lhr-*.json")

        if [ -z "$FILES" ]; then
          echo "| No Data | - | - | - | - | - |" >> $SUMMARY_FILE
        else
          for file in $FILES; do
            URL=$(jq -r '.finalUrl' "$file")

            PERF=$(jq '.categories.performance.score * 100' "$file")
            A11Y=$(jq '.categories.accessibility.score * 100' "$file")
            SEO=$(jq '.categories.seo.score * 100' "$file')

            LCP=$(jq -r '.audits["largest-contentful-paint"].displayValue' "$file")
            CLS=$(jq -r '.audits["cumulative-layout-shift"].displayValue' "$file")

            echo "| $URL | $PERF | $A11Y | $SEO | $LCP | $CLS |" >> $SUMMARY_FILE
          done
        fi

        cat $SUMMARY_FILE
        echo "##vso[task.uploadsummary]$SUMMARY_FILE"
      displayName: 'Publish Lighthouse Summary'

    # =========================
    # VALIDATION
    # =========================
    - script: |
        FAIL=0

        FILES=$(find .lighthouseci -name "lhr-*.json")

        for file in $FILES; do
          SCORE=$(jq '.categories.performance.score * 100' "$file")

          if (( $(echo "$SCORE < 80" | bc -l) )); then
            echo "❌ Performance below threshold"
            FAIL=1
          fi
        done

        if [ $FAIL -eq 1 ]; then
          echo "🚨 Performance gate failed"
          exit 1
        fi
      displayName: 'Validate Performance'