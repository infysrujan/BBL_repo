trigger:
  branches:
    include:
      - dev
      - main
      - feature/*

pr:
  branches:
    include:
      - dev
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# STAGE 1: LINT
# =========================
- stage: Lint
  displayName: "Code Quality Checks"
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: npm install
      displayName: 'Install dependencies'

    - script: npx eslint . --ext .js,.ts,.jsx,.tsx
      displayName: 'Run ESLint'

    - script: npx stylelint "**/*.css" "**/*.scss"
      displayName: 'Run Stylelint'
      continueOnError: true


# =========================
# STAGE 2: PERFORMANCE
# =========================
- stage: Performance
  displayName: "Lighthouse Performance Checks"
  dependsOn: Lint
  condition: succeeded()
  jobs:
  - job: LighthouseJob
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: npm install -g @lhci/cli@0.13.x
      displayName: 'Install Lighthouse CI'

    - script: |
        sudo apt-get update
        sudo apt-get install -y jq bc
      displayName: 'Install dependencies'

    # Run Lighthouse
    - script: lhci autorun
      displayName: 'Run Lighthouse CI'

    # =========================
    # PUBLISH SUMMARY (FIXED)
    # =========================
    - script: |
        SUMMARY_FILE="$(System.DefaultWorkingDirectory)/summary.md"

        echo "Creating summary at: $SUMMARY_FILE"

        echo "## 🚀 Lighthouse Report" > $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE
        echo "| URL | Performance | Accessibility | SEO | LCP | CLS |" >> $SUMMARY_FILE
        echo "|-----|------------|--------------|-----|-----|-----|" >> $SUMMARY_FILE

        FILES=$(find .lighthouseci -name "lhr-*.json")

        if [ -z "$FILES" ]; then
          echo "No Lighthouse files found"
          echo "| No Data | - | - | - | - | - |" >> $SUMMARY_FILE
        else
          for file in $FILES; do
            URL=$(jq -r '.finalUrl' "$file")

            PERF=$(jq '.categories.performance.score * 100' "$file")
            A11Y=$(jq '.categories.accessibility.score * 100' "$file")
            SEO=$(jq '.categories.seo.score * 100' "$file")

            LCP=$(jq -r '.audits["largest-contentful-paint"].displayValue' "$file")
            CLS=$(jq -r '.audits["cumulative-layout-shift"].displayValue' "$file")

            # Badge logic
            PERF_BADGE="🔴"
            if (( $(echo "$PERF >= 90" | bc -l) )); then PERF_BADGE="🟢"; elif (( $(echo "$PERF >= 50" | bc -l) )); then PERF_BADGE="🟠"; fi

            A11Y_BADGE="🔴"
            if (( $(echo "$A11Y >= 90" | bc -l) )); then A11Y_BADGE="🟢"; elif (( $(echo "$A11Y >= 50" | bc -l) )); then A11Y_BADGE="🟠"; fi

            SEO_BADGE="🔴"
            if (( $(echo "$SEO >= 90" | bc -l) )); then SEO_BADGE="🟢"; elif (( $(echo "$SEO >= 50" | bc -l) )); then SEO_BADGE="🟠"; fi

            echo "| $URL | $PERF_BADGE $PERF | $A11Y_BADGE $A11Y | $SEO_BADGE $SEO | $LCP | $CLS |" >> $SUMMARY_FILE
          done
        fi

        echo "===== SUMMARY FILE CONTENT ====="
        cat $SUMMARY_FILE

        echo "Uploading summary..."
        echo "##vso[task.uploadsummary]$SUMMARY_FILE"
      displayName: 'Publish Lighthouse Summary'

    # =========================
    # VALIDATION (FAIL PIPELINE)
    # =========================
    - script: |
        echo "===================================="
        echo " Lighthouse Validation"
        echo "===================================="

        FAIL=0

        FILES=$(find .lighthouseci -name "lhr-*.json")

        if [ -z "$FILES" ]; then
          echo "❌ No Lighthouse reports found!"
          exit 1
        fi

        for file in $FILES; do
          URL=$(jq -r '.finalUrl' "$file")
          SCORE=$(jq '.categories.performance.score * 100' "$file")

          echo "URL: $URL → Score: $SCORE"

          if (( $(echo "$SCORE < 80" | bc -l) )); then
            echo "❌ Performance below threshold (80)"
            FAIL=1
          fi
        done

        if [ $FAIL -eq 1 ]; then
          echo "🚨 Performance gate failed"
          exit 1
        fi
      displayName: 'Validate Lighthouse Scores'