trigger:
  branches:
    include:
      - dev
      - main
      - feature/*

pr:
  branches:
    include:
      - dev
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# STAGE 1: LINT
# =========================
- stage: Lint
  displayName: "Code Quality Checks"
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: npm install
      displayName: 'Install dependencies'

    - script: npx eslint . --ext .js,.ts,.jsx,.tsx
      displayName: 'Run ESLint'

    - script: npx stylelint "**/*.css" "**/*.scss"
      displayName: 'Run Stylelint'
      continueOnError: true


# =========================
# STAGE 2: PERFORMANCE
# =========================
- stage: Performance
  displayName: "Lighthouse Performance Checks"
  dependsOn: Lint
  condition: succeeded()
  jobs:
  - job: LighthouseJob
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: npm install -g @lhci/cli@0.13.x
      displayName: 'Install Lighthouse CI'

    - script: |
        sudo apt-get update
        sudo apt-get install -y jq bc
      displayName: 'Install dependencies'

    # Run Lighthouse
    - script: lhci autorun
      displayName: 'Run Lighthouse CI'

    # Publish Summary (FIXED INDENTATION)
    - script: |
        echo "## Lighthouse Report" > summary.md
        echo "" >> summary.md
        echo "| URL | Performance | Accessibility | SEO |" >> summary.md
        echo "|-----|------------|--------------|-----|" >> summary.md

        for file in $(find .lighthouseci -name "lhr-*.json"); do
          URL=$(jq -r '.finalUrl' "$file")
          PERF=$(jq '.categories.performance.score * 100' "$file")
          A11Y=$(jq '.categories.accessibility.score * 100' "$file")
          SEO=$(jq '.categories.seo.score * 100' "$file")

          echo "| $URL | $PERF | $A11Y | $SEO |" >> summary.md
        done

        echo "##vso[task.uploadsummary]summary.md"
      displayName: 'Publish Lighthouse Summary'

    # Validate Scores
    - script: |
        echo "===================================="
        echo " Lighthouse Scores per URL"
        echo "===================================="

        FAIL=0

        FILES=$(find .lighthouseci -name "lhr-*.json")

        if [ -z "$FILES" ]; then
          echo "❌ No Lighthouse reports found!"
          exit 1
        fi

        for file in $FILES; do
          URL=$(jq -r '.finalUrl' "$file")
          SCORE=$(jq '.categories.performance.score * 100' "$file")

          echo "------------------------------------"
          echo "URL: $URL"
          echo "Performance Score: $SCORE"

          if (( $(echo "$SCORE < 80" | bc -l) )); then
            echo "❌ Performance below threshold (80)"
            FAIL=1
          fi
        done

        echo "===================================="

        if [ $FAIL -eq 1 ]; then
          echo "🚨 Performance gate failed"
          exit 1
        fi
      displayName: 'Validate Lighthouse Scores'