trigger:
  branches:
    include:
      - dev
      - main
      - stage
      - feature/*

pr:
  branches:
    include:
      - dev
      - stage
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# STAGE 1: LINT
# =========================
- stage: Lint
  displayName: "Code Quality Checks"
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: mkdir -p $(Pipeline.Workspace)/.npm
      displayName: 'Create npm cache dir'

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        path: $(Pipeline.Workspace)/.npm
      displayName: 'Cache npm'

    - script: npm config set cache $(Pipeline.Workspace)/.npm --global
      displayName: 'Configure npm cache'

    - script: |
        npm install
        echo "✅ Dependencies installed"
      displayName: 'Install dependencies'

    - script: |
        npx eslint . --ext .js,.ts,.jsx,.tsx
        echo "✅ ESLint passed"
      displayName: 'Run ESLint'

    - script: |
        npx stylelint "**/*.css" "**/*.scss"
        echo "✅ Stylelint completed"
      displayName: 'Run Stylelint'
      continueOnError: true


# =========================
# STAGE 2: PERFORMANCE
# =========================
- stage: Performance
  displayName: "AEM EDS Validation + Lighthouse"
  dependsOn: Lint
  condition: succeeded()
  jobs:
  - job: LighthouseJob
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: mkdir -p $(Pipeline.Workspace)/.npm
      displayName: 'Create npm cache dir'

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | lhci'
        path: $(Pipeline.Workspace)/.npm
      displayName: 'Cache npm'

    - script: npm config set cache $(Pipeline.Workspace)/.npm --global
      displayName: 'Configure npm cache'

    # =========================
    # SET TEST URL
    # =========================
    - script: |
        RAW_BRANCH=$(Build.SourceBranchName)
        BRANCH_NAME=$(echo $RAW_BRANCH | sed 's/\//-/g')

        if [ "$BRANCH_NAME" = "main" ]; then
          TEST_URL="https://main--site-dev--singhalgoru.aem.live/en"
        else
          TEST_URL="https://${BRANCH_NAME}--site-stage--bangkok-bank.aem.page/en"
        fi

        echo "##vso[task.setvariable variable=TEST_URL]$TEST_URL"
        echo "✅ URL resolved: $TEST_URL"
      displayName: 'Set Test URL'

    # =========================
    # CDN HEADER CHECK
    # =========================
    - script: |
        HEADERS=$(curl -s -I $(TEST_URL))

        if ! echo "$HEADERS" | grep -qi "cache-control"; then
          echo "❌ Cache-Control header missing"
          exit 1
        fi

        echo "✅ CDN headers validated"
      displayName: 'Validate CDN Headers'

    # =========================
    # BROKEN LINKS (FAST MODE)
    # =========================
    - script: |
        npx broken-link-checker $(TEST_URL) --recursive false
        echo "✅ Broken link check (shallow) completed"
      displayName: 'Check Broken Links'

    # =========================
    # LIGHTHOUSE (OPTIMIZED)
    # =========================
    - script: |
        npx @lhci/cli@0.13.x collect --url="$(TEST_URL)" --numberOfRuns=2

        LHCI_OUTPUT=$(npx @lhci/cli@0.13.x upload --target=temporary-public-storage)
        echo "$LHCI_OUTPUT"

        PUBLIC_URL=$(echo "$LHCI_OUTPUT" | grep -Eo 'https://[^ ]+\.html' | head -1)

        echo "##vso[task.setvariable variable=LHCI_PUBLIC_URL]$PUBLIC_URL"
        echo "🔗 Lighthouse Report: $PUBLIC_URL"
      displayName: 'Run Lighthouse CI'

    # =========================
    # EXTRACT BEST REPORT (FIXED)
    # =========================
    - script: |
        BEST_SCORE=0
        BEST_FILE=""

        for file in $(find .lighthouseci -name "lhr-*.json"); do
          SCORE=$(cat "$file" | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf-8')); console.log(d.categories.performance.score*100)")

          if (( $(echo "$SCORE > $BEST_SCORE" | bc -l) )); then
            BEST_SCORE=$SCORE
            BEST_FILE=$file
          fi
        done

        BEST_HTML=$(echo $BEST_FILE | sed 's/.json/.html/')

        mkdir best-report
        cp "$BEST_HTML" best-report/lighthouse-best.html

        echo "##vso[task.setvariable variable=BEST_SCORE]$BEST_SCORE"
        echo "🏆 Best Score: $BEST_SCORE"
      displayName: 'Extract Best Report'

    # =========================
    # PUBLISH BEST REPORT
    # =========================
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'best-report'
        artifactName: 'lighthouse-report'
      displayName: 'Publish Best Lighthouse Report'

    # =========================
    # SUMMARY (ALL RUNS)
    # =========================
    - script: |
        SUMMARY_FILE="$(System.DefaultWorkingDirectory)/summary.md"

        echo "## 🚀 Lighthouse Report Summary" > $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE

        echo "**Best Performance Score:** $(BEST_SCORE)" >> $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE

        echo "### 🔗 View Full Report" >> $SUMMARY_FILE
        echo "[Open Lighthouse Report]($(LHCI_PUBLIC_URL))" >> $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE

        echo "### 📊 All Runs Summary" >> $SUMMARY_FILE
        echo "| URL | Perf | A11y | SEO | LCP | CLS |" >> $SUMMARY_FILE
        echo "|-----|------|------|-----|-----|-----|" >> $SUMMARY_FILE

        PASS=0

        for file in $(find .lighthouseci -name "lhr-*.json"); do
          URL=$(cat "$file" | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf-8')); console.log(d.finalUrl)")
          PERF=$(cat "$file" | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf-8')); console.log(d.categories.performance.score*100)")
          A11Y=$(cat "$file" | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf-8')); console.log(d.categories.accessibility.score*100)")
          SEO=$(cat "$file" | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf-8')); console.log(d.categories.seo.score*100)")
          LCP=$(cat "$file" | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf-8')); console.log(d.audits['largest-contentful-paint'].displayValue)")
          CLS=$(cat "$file" | node -e "let d=JSON.parse(require('fs').readFileSync(0,'utf-8')); console.log(d.audits['cumulative-layout-shift'].displayValue)")

          echo "| $URL | $PERF | $A11Y | $SEO | $LCP | $CLS |" >> $SUMMARY_FILE

          if (( $(echo "$PERF >= 80" | bc -l) )); then
            PASS=1
          fi
        done

        if [ $PASS -eq 1 ]; then
          echo "🎉 At least one run passed (≥80)" >> $SUMMARY_FILE
        else
          echo "🚨 All runs below threshold" >> $SUMMARY_FILE
          exit 1
        fi

        echo "##vso[task.uploadsummary]$SUMMARY_FILE"
      displayName: 'Publish Summary'