trigger:
  branches:
    include:
      - dev
      - main
      - feature/*

pr:
  branches:
    include:
      - dev
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# STAGE 1: LINT
# =========================
- stage: Lint
  displayName: "Code Quality Checks"
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: npm install
      displayName: 'Install dependencies'

    - script: npx eslint . --ext .js,.ts,.jsx,.tsx
      displayName: 'Run ESLint'

    - script: npx stylelint "**/*.css" "**/*.scss"
      displayName: 'Run Stylelint'
      continueOnError: true


# =========================
# STAGE 2: PERFORMANCE
# =========================
- stage: Performance
  displayName: "Lighthouse Performance Checks"
  dependsOn: Lint
  condition: succeeded()
  jobs:
  - job: LighthouseJob
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - script: npm install -g @lhci/cli@0.13.x
      displayName: 'Install Lighthouse CI'

    - script: |
        sudo apt-get update
        sudo apt-get install -y jq bc
      displayName: 'Install dependencies'

    # Run Lighthouse
    - script: lhci autorun
      displayName: 'Run Lighthouse CI'

    # =========================
    # ENHANCED SUMMARY
    # =========================
    - script: |
        SUMMARY_FILE="$(System.DefaultWorkingDirectory)/summary.md"

        echo "## 🚀 Lighthouse Report" > $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE
        echo "| URL | Perf | A11y | SEO | LCP | FCP | TBT | CLS |" >> $SUMMARY_FILE
        echo "|-----|------|------|-----|-----|-----|-----|-----|" >> $SUMMARY_FILE

        FILES=$(find .lighthouseci -name "lhr-*.json")

        get_color() {
          SCORE=$1
          if (( $(echo "$SCORE >= 90" | bc -l) )); then
            echo "🟢"
          elif (( $(echo "$SCORE >= 50" | bc -l) )); then
            echo "🟠"
          else
            echo "🔴"
          fi
        }

        if [ -z "$FILES" ]; then
          echo "| No Data | - | - | - | - | - | - | - |" >> $SUMMARY_FILE
        else
          for file in $FILES; do
            URL=$(jq -r '.finalUrl' "$file")

            PERF=$(jq '.categories.performance.score * 100' "$file")
            A11Y=$(jq '.categories.accessibility.score * 100' "$file")
            SEO=$(jq '.categories.seo.score * 100' "$file")

            LCP=$(jq '.audits["largest-contentful-paint"].displayValue' "$file")
            FCP=$(jq '.audits["first-contentful-paint"].displayValue' "$file")
            TBT=$(jq '.audits["total-blocking-time"].displayValue' "$file")
            CLS=$(jq '.audits["cumulative-layout-shift"].displayValue' "$file")

            PERF_ICON=$(get_color $PERF)
            A11Y_ICON=$(get_color $A11Y)
            SEO_ICON=$(get_color $SEO)

            echo "| $URL | $PERF_ICON $PERF | $A11Y_ICON $A11Y | $SEO_ICON $SEO | $LCP | $FCP | $TBT | $CLS |" >> $SUMMARY_FILE
          done
        fi

        echo ""
        echo "##vso[task.uploadsummary]$SUMMARY_FILE"
      displayName: 'Publish Enhanced Lighthouse Summary'

    # =========================
    # VALIDATION
    # =========================
    - script: |
        echo "===================================="
        echo " Lighthouse Validation"
        echo "===================================="

        FAIL=0

        FILES=$(find .lighthouseci -name "lhr-*.json")

        for file in $FILES; do
          URL=$(jq -r '.finalUrl' "$file")
          SCORE=$(jq '.categories.performance.score * 100' "$file")

          echo "URL: $URL → Score: $SCORE"

          if (( $(echo "$SCORE < 80" | bc -l) )); then
            echo "❌ Performance below threshold"
            FAIL=1
          fi
        done

        if [ $FAIL -eq 1 ]; then
          echo "🚨 Performance gate failed"
          exit 1
        fi
      displayName: 'Validate Lighthouse Scores'