trigger:
  branches:
    include:
      - dev
      - main
      - feature/*

pr:
  branches:
    include:
      - dev
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1. Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# 2. Install Lighthouse CI
- script: |
    npm install -g @lhci/cli@0.13.x
  displayName: 'Install Lighthouse CI'

# 3. Install dependencies (jq + bc)
- script: |
    sudo apt-get update
    sudo apt-get install -y jq bc
  displayName: 'Install dependencies'

# 4. Run Lighthouse CI (uses lighthouserc.json)
- script: |
    lhci autorun
  displayName: 'Run Lighthouse CI'

# 5. Extract and print scores
- script: |
    echo "===================================="
    echo " Lighthouse Scores per URL"
    echo "===================================="

    FAIL=0

    FILES=$(find .lighthouseci -name "lhr-*.json")

    if [ -z "$FILES" ]; then
      echo "❌ No Lighthouse reports found!"
      exit 1
    fi

    for file in $FILES; do
      URL=$(jq -r '.finalUrl' "$file")
      SCORE=$(jq '.categories.performance.score * 100' "$file")

      echo "------------------------------------"
      echo "URL: $URL"
      echo "Performance Score: $SCORE"

      # Fail if score < 80
      if (( $(echo "$SCORE < 80" | bc -l) )); then
        echo "❌ Performance below threshold (80)"
        FAIL=1
      fi
    done

    echo "===================================="

    if [ $FAIL -eq 1 ]; then
      echo "🚨 Lighthouse performance check failed"
      exit 1
    fi
  displayName: 'Extract & Validate Scores'